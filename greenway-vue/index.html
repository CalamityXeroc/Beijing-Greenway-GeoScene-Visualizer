<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_icon.svg" />
    <!-- 主题初始化：在任何 JS bundle 加载前执行，彻底防止白屏闪烁 -->
    <script>
      (function() {
        var pref = localStorage.getItem('greenway-theme')
        var mode
        if (pref === 'light') {
          mode = 'day'
        } else if (pref === 'dark') {
          mode = 'night'
        } else {
          // auto: 根据北京时间 (06:00-18:00 = 白天)
          var h = new Date().getHours()
          mode = (h >= 6 && h < 18) ? 'day' : 'night'
        }
        document.documentElement.setAttribute('data-theme', mode)
        console.log('[index.html] 早期主题初始化: ' + mode + ' (pref=' + pref + ')')
      })()
    </script>
    <!-- 移动端优化 meta 标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="true" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="绿脉伴侣" />
    <meta name="theme-color" content="#0d1420" />
    <meta name="description" content="绿脉伴侣 - 基于深度学习与多源空间特征的北京绿道智慧推荐平台" />
    
    <!-- iOS启动屏幕 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- 禁用电话识别和邮箱识别 -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />
    
    <!-- Font Awesome 图标库（本地托管，避免 CND 挂载导致图标丢失） -->
    <link rel="stylesheet" href="/fontawesome/all.min.css" />
    
    <!-- 移动端 CSS -->
    <link rel="stylesheet" href="/src/styles/mobile.css" />
    
    <title>绿脉伴侣 - 北京绿道智慧服务平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
