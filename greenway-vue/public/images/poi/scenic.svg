<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Orange rounded square background -->
  <rect x="4" y="4" width="40" height="40" rx="10" ry="10" fill="#E65100" filter="url(#shadow)"/>
  <!-- White scenic icon: mountain + tree -->
  <g transform="translate(8,10)">
    <!-- Mountain peaks -->
    <polygon points="2,22 10,6 16,14 22,6 30,22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="10,6 16,14 22,6" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Tree on the right -->
    <rect x="26" y="14" width="2" height="8" rx="0.5" fill="#FFFFFF"/>
    <circle cx="27" cy="13" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
</svg>
