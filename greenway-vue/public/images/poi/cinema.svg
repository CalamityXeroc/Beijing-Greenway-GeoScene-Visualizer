<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Purple rounded square background -->
  <rect x="4" y="4" width="40" height="40" rx="10" ry="10" fill="#6A1B9A" filter="url(#shadow)"/>
  <!-- White cinema icon: film reel / clapperboard -->
  <g transform="translate(10,10) scale(1.0)">
    <!-- Filmstrip body -->
    <rect x="3" y="5" width="22" height="18" rx="1" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Left sprocket holes -->
    <rect x="5" y="7" width="3" height="2.5" rx="0.5" fill="#FFFFFF"/>
    <rect x="5" y="11" width="3" height="2.5" rx="0.5" fill="#FFFFFF"/>
    <rect x="5" y="15" width="3" height="2.5" rx="0.5" fill="#FFFFFF"/>
    <rect x="5" y="19" width="3" height="2.5" rx="0.5" fill="#FFFFFF"/>
    <!-- Right sprocket holes -->
    <rect x="20" y="7" width="3" height="2.5" rx="0.5" fill="#FFFFFF"/>
    <rect x="20" y="11" width="3" height="2.5" rx="0.5" fill="#FFFFFF"/>
    <rect x="20" y="15" width="3" height="2.5" rx="0.5" fill="#FFFFFF"/>
    <rect x="20" y="19" width="3" height="2.5" rx="0.5" fill="#FFFFFF"/>
    <!-- Play triangle -->
    <polygon points="12,10 12,18 18,14" fill="#FFFFFF"/>
  </g>
</svg>
