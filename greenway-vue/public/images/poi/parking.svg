<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Green rounded square background -->
  <rect x="4" y="4" width="40" height="40" rx="10" ry="10" fill="#2E7D32" filter="url(#shadow)"/>
  <!-- White "P" parking letter (bold, centered) -->
  <text x="24" y="32" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P</text>
</svg>
